[pytest]
testpaths = testcase
markers =
    integration: live-network tests against the deployed site (need VERCEL_BASE_URL)
    schema: tests that require sync/auth_schema_v2.sql to be applied in Supabase (auto-skip otherwise)
    rate_limit: opt-in brute-force probe against verify-invite (locks caller IP briefly; run explicitly)
addopts = -q --tb=short -m "not rate_limit"
