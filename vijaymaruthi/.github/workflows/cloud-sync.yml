# ═══════════════════════════════════════════════════════════════════════
#  Cloud price sync — runs the VijayMaruthi OHLCV refresh in the cloud
#  once daily at 15:30 IST, with NO Mac and NO paid plan.
#
#  Free tier notes (GitHub):
#    • Private repos: 2,000 minutes/month free
#      — a 15-min full run x1/day ≈ 450 min/month. Plenty of headroom;
#      to trim further, use --limit via the CLOUD_SYNC_LIMIT repo variable.
#    • Public repos: unlimited minutes, free forever.
#
#  Secrets required (repo Settings → Secrets and variables → Actions):
#    SUPABASE_URL                — https://xxxx.supabase.co
#    SUPABASE_SERVICE_ROLE_KEY   — service_role key (never expose in code)
#
#  Trigger manually:  Actions → "Cloud price sync" → Run workflow
# ═══════════════════════════════════════════════════════════════════════
name: Cloud price sync

on:
  schedule:
    # Once daily at 15:30 IST (10:00 UTC). GitHub Actions cron = UTC.
    # 3:30 PM IST = 10:00 AM UTC (IST is UTC+5:30).
    - cron: "0 10 * * *"
  workflow_dispatch: {} # manual "Run workflow" button

permissions:
  contents: read

concurrency:
  group: cloud-sync
  cancel-in-progress: false # never stack runs on top of each other

jobs:
  sync:
    name: Sync OHLCV → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run cloud sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python cloud/sync_cloud_prices.py --limit ${{ vars.CLOUD_SYNC_LIMIT || 0 }} --workers 4
